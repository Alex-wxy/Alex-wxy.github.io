// ===== 全球销量-Marklines =====
function renderGlobalMarklines(gd) {
  var content = document.getElementById('content');

  var html = '';

  // --- 图表1: EV + PHEV 月度销量 ---
  html += '<div class="sec" style="border-color:var(--accent)">全球新能源车月度销量</div>';
  html += '<div class="grid"><div class="card full">';
  html += '<div class="ch">悬停图表显示具体数值</div>';
  html += '<div id="g_sales" class="chart" style="height:420px"></div>';
  html += '<div class="ch" style="text-align:right;margin-top:2px;margin-bottom:0">来源：Marklines</div>';
  html += '</div></div>';

  // --- 图表2: 渗透率 ---
  html += '<div class="sec" style="border-color:#FF7F7F">全球新能源乘用车渗透率</div>';
  html += '<div class="grid"><div class="card full">';
  //html += '<h2>各年月度渗透率走势</h2>';
  html += '<div class="ch">各年1-12月数据</div>';
  html += '<div id="g_penetration" class="chart" style="height:400px"></div>';
  html += '<div class="ch" style="text-align:right;margin-top:2px;margin-bottom:0">来源：Marklines</div>';
  html += '</div></div>';

  content.innerHTML = html;

  // ---- 渲染销量图 ----
  var dates = gd.sales.map(function(d) { return d.date; });
  var evData = gd.sales.map(function(d) { return d.ev; });
  var phevData = gd.sales.map(function(d) { return d.phev; });
  var yoyData = gd.sales.map(function(d) { return d.yoy; });
  var momData = gd.sales.map(function(d) { return d.mom; });
  mk('g_sales', {
    color: PALETTE,
    tooltip: {
      trigger: 'axis',
      backgroundColor: '#ffffff',
      borderColor: '#B4CAD8',
      textStyle: { color: '#367198' },
      formatter: function(ps) {
        if (!ps.length) return '';
        var s = ps[0].axisValue + '<br>';
        ps.forEach(function(p) {
          if (p.value != null) {
            var unit = (p.seriesName.indexOf('同比') >= 0 || p.seriesName.indexOf('环比') >= 0) ? '%' : ' 万辆';
            s += p.marker + p.seriesName + '：' + p.value.toFixed(2) + unit + '<br>';
          }
        });
        return s;
      }
    },
    legend: { top: 5, left: 'center', textStyle: { color: '#5a7d99' }, itemWidth: 18, itemHeight: 10 },
    grid: { left: 60, right: 65, top: 50, bottom: 45 },
    xAxis: {
      type: 'category', data: dates,
      axisLine: { lineStyle: { color: '#B4CAD8' } },
      axisLabel: { color: '#5a7d99', interval: Math.max(1, Math.floor(dates.length / 12)) }
    },
    yAxis: [
      { type: 'value', name: '万辆', nameGap: 25, nameTextStyle: { color: '#5a7d99', padding: [0, 38, 0, 0] }, splitLine: { lineStyle: { color: '#B5E1FD' } }, axisLabel: { color: '#5a7d99' } },
      { type: 'value', name: '%', nameGap: 25, nameTextStyle: { color: '#5a7d99', padding: [0, 0, 0, 23] }, splitLine: { show: false }, axisLabel: { color: '#5a7d99' } }
    ],
    dataZoom: [
      { type: 'slider', start: 0, end: 100, height: 22, bottom: 10 },
      { type: 'inside', start: 0, end: 100, zoomOnMouseWheel: true, moveOnMouseMove: true }
    ],
    series: [
      { name: 'EV', type: 'bar', stack: 'total', data: evData, itemStyle: { color: '#367198' }, emphasis: {} },
      { name: 'PHEV', type: 'bar', stack: 'total', data: phevData, itemStyle: { color: '#C00000' }, emphasis: {} },
      { name: '合计-同比', type: 'line', yAxisIndex: 1, data: yoyData, smooth: true, showSymbol: false,
         lineStyle: { width: 2, color: '#FF3333' }, itemStyle: { color: '#FF3333' }, emphasis: {} },
      { name: '合计-环比', type: 'line', yAxisIndex: 1, data: momData, smooth: true, showSymbol: false,
         lineStyle: { width: 2, color: '#FF7F7F' }, itemStyle: { color: '#FF7F7F' }, emphasis: {} }
    ]
  });

  // ---- 渲染渗透率图 ----
  var penYears = Object.keys(gd.penetration).sort();
  var latestPenYear = penYears[penYears.length - 1];
  var penSeries = penYears.map(function(y, yi) {
    var hot = y === latestPenYear;
    return {
      name: y + '年', type: 'line', data: gd.penetration[y],
      connectNulls: false, symbol: 'circle',
      symbolSize: hot ? 6 : 4,
      lineStyle: { width: hot ? 3.5 : 1.8, color: PALETTE[yi % PALETTE.length] },
      itemStyle: { color: PALETTE[yi % PALETTE.length] },
      emphasis: {}, z: hot ? 10 : 1
    };
  });

  mk('g_penetration', {
    color: PALETTE,
    tooltip: {
      trigger: 'axis',
      backgroundColor: '#ffffff',
      borderColor: '#B4CAD8',
      textStyle: { color: '#367198' },
      formatter: function(ps) {
        if (!ps.length) return '';
        var s = ps[0].axisValue + '<br>';
        ps.forEach(function(p) {
          s += p.marker + p.seriesName + '：' + (p.value != null ? p.value.toFixed(2) + '%' : '-') + '<br>';
        });
        return s;
      }
    },
    legend: { top: 5, left: 'center', textStyle: { color: '#5a7d99', fontSize: 11 }, inactiveColor: '#B4CAD8', itemWidth: 16, itemHeight: 8 },
    grid: { left: 55, right: 15, top: 40, bottom: 28 },
    xAxis: { type: 'category', data: MONTHS, axisLine: { lineStyle: { color: '#B4CAD8' } }, axisLabel: { color: '#5a7d99' }, boundaryGap: false },
    yAxis: { type: 'value', name: '%', nameTextStyle: { color: '#5a7d99', padding: [0, 45, 0, 0] }, scale: true, splitLine: { lineStyle: { color: '#B5E1FD' } }, axisLabel: { color: '#5a7d99' } },
    series: penSeries
  });
}

    }

    mk('zqx_block_' + bi, {
      color: PALETTE,
      tooltip: {
        trigger: 'axis',
        backgroundColor: '#ffffff',
        borderColor: '#B4CAD8',
        textStyle: { color: '#367198' },
        formatter: function(ps) {
          if (!ps.length) return '';
          var s = ps[0].axisValue + '<br>';
          ps.forEach(function(p) {
            if (p.value != null) {
              var unit = (p.seriesName.indexOf('同比') >= 0 || p.seriesName.indexOf('环比') >= 0) ? '%' : ' 万辆';
              s += p.marker + p.seriesName + '：' + p.value.toFixed(2) + unit + '<br>';
            }
          });
          return s;
        }
      },
      legend: { top: 5, left: 'center', textStyle: { color: '#5a7d99' }, itemWidth: 18, itemHeight: 10 },
      grid: { left: 60, right: hasLines ? 65 : 20, top: 50, bottom: 45 },
      xAxis: {
        type: 'category', data: block.dates,
        axisLine: { lineStyle: { color: '#B4CAD8' } },
        axisLabel: { color: '#5a7d99', interval: Math.max(1, Math.floor(block.dates.length / 12)) }
      },
      yAxis: hasLines ? [
        { type: 'value', name: '万辆', splitLine: { lineStyle: { color: '#B5E1FD' } }, axisLabel: { color: '#5a7d99' } },
        { type: 'value', name: '%', splitLine: { show: false }, axisLabel: { color: '#5a7d99' } }
      ] : [
        { type: 'value', name: '万辆', splitLine: { lineStyle: { color: '#B5E1FD' } }, axisLabel: { color: '#5a7d99' } }
      ],
      dataZoom: [
        { type: 'slider', start: 0, end: 100, height: 22, bottom: 10 },
        { type: 'inside', start: 0, end: 100, zoomOnMouseWheel: true, moveOnMouseMove: true }
      ],
      series: series
    });
  });

  // 渲染渗透率图
  var penYears = Object.keys(gd.penetration).sort();
  var latestPenYear = penYears[penYears.length - 1];
  var penSeries = penYears.map(function(y, yi) {
    var hot = y === latestPenYear;
    return {
      name: y + '年', type: 'line', data: gd.penetration[y],
      connectNulls: false, symbol: 'circle',
      symbolSize: hot ? 6 : 4,
      lineStyle: { width: hot ? 3.5 : 1.8, color: PALETTE[yi % PALETTE.length] },
      itemStyle: { color: PALETTE[yi % PALETTE.length] },
      emphasis: {}, z: hot ? 10 : 1
    };
  });

  mk('zqx_penetration', {
    color: PALETTE,
    tooltip: {
      trigger: 'axis',
      backgroundColor: '#ffffff',
      borderColor: '#B4CAD8',
      textStyle: { color: '#367198' },
      formatter: function(ps) {
        if (!ps.length) return '';
        var s = ps[0].axisValue + '<br>';
        ps.forEach(function(p) {
          s += p.marker + p.seriesName + '：' + (p.value != null ? p.value.toFixed(2) + '%' : '-') + '<br>';
        });
        return s;
      }
    },
    legend: { top: 5, left: 'center', textStyle: { color: '#5a7d99', fontSize: 11 }, inactiveColor: '#B4CAD8', itemWidth: 16, itemHeight: 8 },
    grid: { left: 55, right: 15, top: 40, bottom: 28 },
    xAxis: { type: 'category', data: MONTHS, axisLine: { lineStyle: { color: '#B4CAD8' } }, axisLabel: { color: '#5a7d99' }, boundaryGap: false },
    yAxis: { type: 'value', name: '%', nameTextStyle: { color: '#5a7d99', padding: [0, 45, 0, 0] }, scale: true, splitLine: { lineStyle: { color: '#B5E1FD' } }, axisLabel: { color: '#5a7d99' } },
    series: penSeries
  });
}

// 注册到全局渲染表
RENDER_MAP['全球销量-Marklines'] = renderGlobalMarklines;
RENDER_MAP['中国销量-中汽协'] = renderZhongQiXie;

function mk(id, opt) {
  const el = document.getElementById(id);
  if (!el) return null;
  const ch = echarts.init(el);
  ch.setOption(opt);
  CHARTS_ARR.push(ch);
  return ch;
}

window.addEventListener('resize', function() { CHARTS_ARR.forEach(function(c) { c.resize(); }); });

// ===== 一级导航（大分类） =====
(function() {
  var tnav = document.getElementById('tnav');
  var sidebar = document.getElementById('sidebar');
  var content = document.getElementById('content');
  var metaInfo = document.getElementById('meta_info');
  var currentTopCat = null;
  var currentSheet = null;

  // 渲染一级导航按钮
  RAW.categories.forEach(function(cat, i) {
    var btn = document.createElement('button');
    btn.className = 'tbtn' + (i === 0 ? ' active' : '');
    btn.textContent = cat.name;
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tbtn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      switchCategory(cat);
    });
    tnav.appendChild(btn);
  });

  // 默认选中第一个大分类
  switchCategory(RAW.categories[0]);

  function switchCategory(cat) {
    currentTopCat = cat;
    metaInfo.innerHTML = cat.name + ' · 数据区间：<b>' + (cat.dateRange || '待录入') + '</b> · 来源：中信建投证券整理';

    // 渲染二级导航（sheet 侧边栏）
    sidebar.innerHTML = '';
    if (cat.sheets && cat.sheets.length > 0) {
      cat.sheets.forEach(function(s, i) {
        var btn = document.createElement('button');
        btn.className = 'sbtn' + (i === 0 ? ' active' : '');
        btn.textContent = s;
        btn.addEventListener('click', function() {
          document.querySelectorAll('.sbtn').forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          switchSheet(s);
        });
        sidebar.appendChild(btn);
      });
      switchSheet(cat.sheets[0]);
    } else {
      content.innerHTML = '<div class="sec" style="margin-top:24px">' + cat.name + '</div><p style="color:var(--sub);margin-top:12px">数据模块正在建设中，敬请期待。</p>';
    }
  }

  function switchSheet(name) {
    currentSheet = name;
    // 清理旧图表
    CHARTS_ARR.forEach(function(c) { c.dispose(); });
    CHARTS_ARR.length = 0;

    var gd = currentTopCat.sheetData[name];
    var renderFn = RENDER_MAP[name];
    if (renderFn && gd) {
      renderFn(gd);
    } else {
      content.innerHTML = '<div class="sec" style="margin-top:24px">' + name + '</div><p style="color:var(--sub);margin-top:12px">该模块正在建设中，敬请期待。</p>';
    }
  }
})();


</script>
